<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Architects+Daughter&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body{ margin:0; background: oklch(0.97 0 0); color: oklch(0.30 0 0);
          font-family: Archivo, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a{ color: oklch(0.55 0.11 250); } a:hover{ color: oklch(0.45 0.11 250); }
    .hand{ font-family: "Architects Daughter", "Comic Sans MS", cursive; }
  </style>
</helmet>

<div style="width:390px; min-height:700px; display:flex; flex-direction:column; background: oklch(0.97 0 0); padding:22px 18px;">

  <div class="hand" style="font-size:19px; color: oklch(0.40 0 0);">Direction C &mdash; one thing at a time</div>
  <div class="hand" style="font-size:13px; color: oklch(0.58 0 0); line-height:1.5; padding:6px 0 18px;">No list. The app shows you the next habit due and nothing else. Swipe for the next.</div>

  <div style="border:1.5px solid oklch(0.72 0 0); border-radius:4px; background: oklch(0.995 0 0); padding:26px 22px; display:flex; flex-direction:column; align-items:center; text-align:center;">
    <div style="height:8px; width:58px; background: oklch(0.86 0 0); border-radius:2px;"></div>
    <div style="width:104px; height:104px; border-radius:999px; border:2.5px solid oklch(0.75 0 0); margin-top:22px; display:flex; align-items:center; justify-content:center;">
      <div style="width:72px; height:72px; border-radius:999px; background: oklch(0.92 0 0);"></div>
    </div>
    <div style="height:15px; width:150px; background: oklch(0.82 0 0); border-radius:3px; margin-top:22px;"></div>
    <div style="height:8px; width:96px; background: oklch(0.89 0 0); border-radius:2px; margin-top:10px;"></div>

    <div style="width:100%; height:52px; border-radius:26px; background: oklch(0.55 0.11 250); margin-top:26px; display:flex; align-items:center; justify-content:center;">
      <div style="height:9px; width:74px; background: oklch(0.90 0.03 250); border-radius:2px;"></div>
    </div>
    <div style="display:flex; gap:12px; margin-top:12px;">
      <div style="height:8px; width:44px; background: oklch(0.88 0 0); border-radius:2px;"></div>
      <div style="height:8px; width:44px; background: oklch(0.88 0 0); border-radius:2px;"></div>
    </div>
  </div>

  <div style="display:flex; align-items:center; justify-content:center; gap:7px; margin-top:16px;">
    <div style="width:7px; height:7px; border-radius:999px; background: oklch(0.55 0.11 250);"></div>
    <div style="width:7px; height:7px; border-radius:999px; background: oklch(0.84 0 0);"></div>
    <div style="width:7px; height:7px; border-radius:999px; background: oklch(0.84 0 0);"></div>
    <div style="width:7px; height:7px; border-radius:999px; background: oklch(0.84 0 0);"></div>
  </div>

  <div style="margin-top:20px; border:1.5px dashed oklch(0.75 0 0); border-radius:4px; padding:14px; display:flex; align-items:center; gap:11px;">
    <div style="width:30px; height:30px; border-radius:999px; background: oklch(0.88 0 0); flex-shrink:0;"></div>
    <div style="flex-grow:1;">
      <div style="height:8px; width:112px; background: oklch(0.86 0 0); border-radius:2px;"></div>
      <div style="height:7px; width:74px; background: oklch(0.90 0 0); border-radius:2px; margin-top:7px;"></div>
    </div>
    <div class="hand" style="font-size:11px; color: oklch(0.60 0 0);">friend did it too</div>
  </div>

  <div class="hand" style="margin-top:auto; padding-top:22px; font-size:12px; color: oklch(0.60 0 0); line-height:1.6;">
    <strong>Trade-off:</strong> lowest friction of the three, and the kindest. But you lose the at-a-glance overview, and it hides how the week is actually going.
  </div>

</div>
</x-dc>
</body>
</html>

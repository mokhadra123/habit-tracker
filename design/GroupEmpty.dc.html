ch(0.999 0.003 80); border:1.5px solid oklch(0.86 0.012 80); color:oklch(0.24 0.018 55); font-family:inherit; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4.5 4.5 0 0 0 6.8.5l2.7-2.7a4.5 4.5 0 1 0-6.4-6.4l-1.5 1.5"/><path d="M14 10.5a4.5 4.5 0 0 0-6.8-.5l-2.7 2.7a4.5 4.5 0 1 0 6.4 6.4l1.5-1.5"/></svg>Join with a code</button></div><div style="font-size:11.5px; color:oklch(0.72 0.010 55); margin-top:18px; line-height:1.6;">Three to five people. More than that and nobody notices when you go quiet.</div></div><div style="margin-top:auto; border-top:1px solid oklch(0.905 0.010 80); background:oklch(0.999 0.003 80); padding:9px 14px 18px; display:flex; justify-content:space-between;"><div style="min-width:64px; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:oklch(0.72 0.010 55); position:relative;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="17" rx="4"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/></svg><span style="font-size:10px; font-weight:400;">Today</span></div><div style="min-width:64px; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:oklch(0.72 0.010 55); position:relative;"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg><span style="font-size:10px; font-weight:400;">Habits</span></div><div style="min-width:64px; min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:o

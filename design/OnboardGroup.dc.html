<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body{ margin:0; background: oklch(0.982 0.008 80); color: oklch(0.24 0.018 55);
          font-family: Archivo, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a{ color: oklch(0.58 0.12 45); } a:hover{ color: oklch(0.47 0.12 45); }
    .serif{ font-family: "Instrument Serif", Georgia, serif; font-weight:400; }
    .cap{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; font-weight:600; color: oklch(0.66 0.010 55); }
  </style>
</helmet>

<div style="width:390px; min-height:880px; display:flex; flex-direction:column; background: oklch(0.982 0.008 80); padding:0;">

<div style="padding:46px 24px 0; flex-grow:1; display:flex; flex-direction:column;">
  <div style="display:flex; gap:6px;">
    <div style="flex-grow:1; height:4px; border-radius:999px; background:oklch(0.58 0.12 45);"></div>
    <div style="flex-grow:1; height:4px; border-radius:999px; background:oklch(0.58 0.12 45);"></div>
    <div style="flex-grow:1; height:4px; border-radius:999px; background:oklch(0.905 0.010 80);"></div>
  </div>
  <div class="cap" style="padding-top:22px;">Step 2 of 3</div>
  <div class="serif" style="font-size:32px; line-height:1.08; margin-top:7px;">Who is doing this<br>with you?</div>
  <div style="font-size:13px; color:oklch(0.50 0.014 55); margin-top:10px; line-height:1.6; text-wrap:pretty;">
    This is the part that actually works. Alone, most people stop by week six.</div>

  <div style="display:flex; flex-direction:column; gap:10px; margin-top:24px;">
    <button style="width:100%; display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:15px; background:oklch(0.58 0.12 45); border:1.5px solid oklch(0.58 0.12 45); color:oklch(0.99 0.008 45); font-family:inherit; cursor:pointer; min-height:44px; text-align:left;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20"/><circle cx="9" cy="7" r="3.6"/><path d="M22 20v-1.5a4 4 0 0 0-3-3.85"/><path d="M16.5 3.6a4 4 0 0 1 0 7"/></svg><div style="flex-grow:1;"><div style="text-align:left;"><div style="font-size:14px; font-weight:600;">Start a group</div><div style="font-size:11.5px; opacity:0.8; margin-top:3px; line-height:1.4;">Invite three or four people by link</div></div></div><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <button style="width:100%; display:flex; align-items:center; gap:12px; padding:15px 16px; border-radius:15px; background:oklch(0.999 0.003 80); border:1.5px solid oklch(0.86 0.012 80); color:oklch(0.24 0.018 55); font-family:inherit; cursor:pointer; min-height:44px; text-align:left;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13.5a4.5 4.5 0 0 0 6.8.5l2.7-2.7a4.5 4.5 0 1 0-6.4-6.4l-1.5 1.5"/><path d="M14 10.5a4.5 4.5 0 0 0-6.8-.5l-2.7 2.7a4.5 4.5 0 1 0 6.4 6.4l1.5-1.5"/></svg><div style="flex-grow:1;"><div style="text-align:left;"><div style="font-size:14px; font-weight:600;">Join with a code</div><div style="font-size:11.5px; opacity:0.8; margin-top:3px; line-height:1.4;">Someone already sent you one</div></div></div><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>

  <div style="height:18px;"></div><div style="padding:13px 15px; background:oklch(0.955 0.024 45); border-radius:14px; display:flex; gap:10px; align-items:flex-start;"><span style="color:oklch(0.36 0.07 45); flex-shrink:0; margin-top:1px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 16.5v-5"/><circle cx="12" cy="8" r="0.7" fill="currentColor"/></svg></span><div style="font-size:11.5px; line-height:1.5; color:oklch(0.48 0.05 45); text-wrap:pretty;">Three to five people is the sweet spot. Big groups stop feeling personal and nobody notices when you go quiet.</div></div>

  <div style="margin-top:auto; padding:22px 0 30px;">
    <div style="text-align:center; font-size:12.5px; color:oklch(0.50 0.014 55);">I will do this on my own for now</div>
  </div>
</div>
</div>
</x-dc>

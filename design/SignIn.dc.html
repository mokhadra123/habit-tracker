<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
  <style>
    *{ box-sizing: border-box; }
    body{ margin:0; background: oklch(0.982 0.008 80); color: oklch(0.24 0.018 55);
          font-family: Archivo, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    a{ color: oklch(0.58 0.12 45); } a:hover{ color: oklch(0.47 0.12 45); }
    .serif{ font-family: "Instrument Serif", Georgia, serif; font-weight:400; }
    .cap{ font-size:10px; letter-spacing:0.12em; text-transform:uppercase; font-weight:600; color: oklch(0.66 0.010 55); }
  </style>
</helmet>

<div style="width:390px; min-height:880px; display:flex; flex-direction:column; background: oklch(0.982 0.008 80); padding:0;">

<div style="padding:66px 26px 0; flex-grow:1; display:flex; flex-direction:column;">
  <div style="width:44px; height:44px; border-radius:13px; background:oklch(0.58 0.12 45); display:flex; align-items:center; justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="oklch(0.99 0.008 45)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>
  <div class="serif" style="font-size:38px; line-height:1.08; margin-top:24px;">Keep going,<br>together.</div>
  <div style="font-size:14px; color:oklch(0.50 0.014 55); margin-top:12px; line-height:1.6; text-wrap:pretty;">A habit tracker for a few friends who actually check on each other.</div>

  <div style="display:flex; flex-direction:column; gap:10px; margin-top:34px;">
    <div style="padding:13px 15px; background:oklch(0.999 0.003 80); border:1.5px solid oklch(0.905 0.010 80); border-radius:14px;"><div class="cap">Email</div><div style="display:flex; align-items:center; gap:10px; margin-top:7px; color:oklch(0.66 0.010 55);"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4.5" width="19" height="15" rx="3"/><path d="m3.5 6.5 8.5 6 8.5-6"/></svg><span style="font-size:15px; color:oklch(0.24 0.018 55);">mohamed@example.com</span></div></div>
    <div style="padding:13px 15px; background:oklch(0.999 0.003 80); border:1.5px solid oklch(0.905 0.010 80); border-radius:14px;"><div class="cap">Password</div><div style="display:flex; align-items:center; gap:10px; margin-top:7px; color:oklch(0.66 0.010 55);"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4.5"/><path d="m11.4 11.6 8.1-8.1M17 6l2.5 2.5M14.5 8.5 17 11"/></svg><span style="font-size:15px; color:oklch(0.24 0.018 55);">••••••••••</span></div></div>
  </div>

  <div style="display:flex; align-items:center; gap:14px; margin:22px 0;">
    <div style="flex-grow:1; height:1px; background:oklch(0.905 0.010 80);"></div>
    <span style="font-size:11px; color:oklch(0.66 0.010 55);">or</span>
    <div style="flex-grow:1; height:1px; background:oklch(0.905 0.010 80);"></div>
  </div>

  <div style="display:flex; flex-direction:column; gap:10px;">
    <button style="width:100%; min-height:48px; padding:0 18px; border-radius:14px; background:oklch(0.58 0.12 45); border:1.5px solid oklch(0.58 0.12 45); color:oklch(0.99 0.008 45); font-family:inherit; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer;">Sign in</button>
    <button style="width:100%; min-height:48px; padding:0 18px; border-radius:14px; background:oklch(0.999 0.003 80); border:1.5px solid oklch(0.86 0.012 80); color:oklch(0.24 0.018 55); font-family:inherit; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer;">Continue with Google</button>
  </div>
  <div style="height:16px;"></div><div style="padding:13px 15px; background:oklch(0.9725 0.010 80); border-radius:14px; display:flex; gap:10px; align-items:flex-start;"><span style="color:oklch(0.50 0.014 55); flex-shrink:0; margin-top:1px;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg></span><div style="font-size:11.5px; line-height:1.5; color:oklch(0.50 0.014 55); text-wrap:pretty;">Sessions last 90 days on this device. We never post anything anywhere.</div></div>

  <div style="margin-top:auto; padding:26px 0 32px; text-align:center;">
    <span style="font-size:12.5px; color:oklch(0.50 0.014 55);">No account yet? </span>
    <span style="font-size:12.5px; font-weight:600; color:oklch(0.58 0.12 45);">Create one</span>
  </div>
</div>
</div>
</x-dc>
</body>
</html>
